<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>hpclib console</title>
  <link rel="icon" type="image/x-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="topbar">
    <span class="brand">hpclib</span>
    <nav id="apps"></nav>
    <span id="topstatus" class="muted"></span>
    <button id="add-package" type="button" title="Install an app or settings from a package zip">Add App or Settings</button>
  </div>
  <header>
    <strong id="app-title">Agents</strong>
    <nav id="pages"></nav>
    <button id="refresh" type="button">Refresh</button>
  </header>

  <main id="main"></main>

  <hpc-dialog id="key-dialog" heading="Session key">
    <form id="key-form">
      <p>Paste the session key that <code>agent_console</code> printed, or open the URL it gives with
        <code>--static</code>.</p>
      <input id="key-input" type="password" autocomplete="off" required placeholder="session key">
      <div class="actions"><button class="primary" type="submit">Connect</button></div>
    </form>
  </hpc-dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
