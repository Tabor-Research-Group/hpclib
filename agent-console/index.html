<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Agent Console</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <strong>Agent Console</strong>
    <nav>
      <a href="#/clusters" data-page="clusters">Clusters</a>
      <a href="#/proposals" data-page="proposals">Proposals <span id="badge" class="badge" hidden></span></a>
      <a href="#/activity" data-page="activity">Activity</a>
      <a href="#/settings" data-page="settings">Settings</a>
    </nav>
    <button id="refresh" type="button">Refresh</button>
  </header>

  <main id="main"></main>

  <dialog id="key-dialog">
    <form id="key-form">
      <p>Paste the session key that <code>agent_console</code> printed, or open the URL it gives with
        <code>--static</code>.</p>
      <input id="key-input" type="password" autocomplete="off" required placeholder="session key">
      <button type="submit">Connect</button>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
