<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Workspace</title>
  <!-- the console's theme and stylesheet come in the address (bridge.js); its variables sit under the page's own -->
  <link rel="stylesheet" href="ui/hpclib-ui/default-styles.css">
  <script src="ui/bridge.js"></script>
  <link rel="stylesheet" href="ui/hpclib-ui/base.css">
  <link rel="stylesheet" href="ui/workspace.css">
  <!-- hpclib-ui/ is the package's copy of hpclib/ui; pointing it at a CDN later is a change to this line -->
  <script type="importmap">{"imports": {"hpclib-ui/": "./ui/hpclib-ui/"}}</script>
  <script type="module" src="ui/app.js"></script>
</head>
<body>
  <header class="top">
    <strong class="brand">Workspace</strong>
    <span class="host muted" id="host"></span>
    <div class="actions push-right" id="top-actions"></div>
  </header>
  <hpc-split class="main" id="side-split" fixed="first" size="340" min="200" min-other="300" persist="ws.side" label="Resize the file list">
    <aside class="side">
      <hpc-split id="side-inner" direction="column" fixed="last" size="170" min="60" min-other="160" persist="ws.runs" label="Resize the runs list">
        <div class="files-slot" id="files-slot"></div>
        <section class="runs" id="runs-slot"></section>
      </hpc-split>
    </aside>
    <hpc-split class="work" id="dock-split" direction="column" fixed="last" size="300" min="120" min-other="160" persist="ws.dock" label="Resize the terminals">
      <section class="work-main">
        <hpc-tabs id="tabs" label="Open files"></hpc-tabs>
        <div class="views" id="views">
          <div class="empty muted" id="empty">Open a file from the list, or <strong>Submit job…</strong> from a Python
            or bash script's menu (⋯). Drop files on the list to upload them.</div>
        </div>
      </section>
      <section class="dock" id="dock" hidden>
        <div class="dock-bar">
          <hpc-tabs id="dock-tabs" label="Terminals"></hpc-tabs>
          <div class="actions">
            <button type="button" class="small-button" id="dock-new">+ Terminal</button>
            <button type="button" class="small-button" id="dock-hide">Hide</button>
          </div>
        </div>
        <div class="dock-views" id="dock-views"></div>
      </section>
    </hpc-split>
  </hpc-split>
</body>
</html>
